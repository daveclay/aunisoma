<html>
<style lang="css">
    body {
        background-color: black;
        font-family: monospace;
        color: gray;
    }
    #stage {
    }
    .panelContainer {
        display: inline-block;
        min-height: 1px;
    }
    .panel {
        display: block;
        width: 50px; /* 24" */
        height: 100px; /* 48" */
        background-color: rgb(60, 60, 60);
        border: 1px solid #222222;
        margin: 5px;
    }
    .panelInfo {
        display: block;
        width: 50px; /* 24" */
        height: 50px;
        overflow-x: clip;
        text-align: center;
        padding-left: 6px; /* align it center, for some reason */
        font-size: 10px;
    }
    .panelReverberationInfo {
        display: inline-block;
        width: 50px;
        height: 20px;
        margin: 5px;
        border: 1px solid #222222;
    }
    #panelTemplate {
        display: none;
    }
    .controlTable tr td {
        border: 1px solid #333333;
        vertical-align: top;
        padding: 5px;
    }
</style>
<body>
<div id="stage"></div>
<div id="panelTemplate" class="panelContainer">
    <div class="panel"></div>
    <div class="panelInfo">&nbsp;</div>
</div>
Click on a panel to simulate a person interacting with a panel. Click on the panel again to simulate a person walking away from the panel.
<hr/>
<table class="controlTable">
    <tr>
        <td>
            <p>
                <label for="triggerScript">script</label>
            </p>
            <p>
                <input type="file" id="triggerScript"/>
            </p>
        </td>
        <td>
            <p>
                <div id="step"></div>
            </p>
            <p>
                <button id="pauseButton">Pause</button>
            </p>
            <p>
                <input type="text" id="jumpToStepInput"/>
            </p>
        </td>
        <td>
            <p>
                Current Power Draw: <input type="text" id="currentPowerDraw">
            </p>
            <p>
                Max Power Draw: <input type="text" id="maxPowerDraw">
            </p>
        </td>
        <td>
            <p>
                <label>
                    <input type="checkbox" id="applyGammaCheckbox" checked/>
                    Apply gamma LUT
                </label>
            </p>
        </td>
        <td>
            <p>
                <label for="stepIntervalInput">ms per step</label>
            </p>
            <p>
                <input type="text" id="stepIntervalInput" value="62"/>
            </p>
            <p>
                (hardware runs one loop every 62 ms)
            </p>
        </td>
    </tr>
</table>
<script>
  document.addEventListener("DOMContentLoaded", (event) => {
    let running = false;
    const PANEL_TEMPLATE_ELEMENT = document.getElementById("panelTemplate");
    const STAGE = document.getElementById("stage");
    const TRIGGER_SCRIPT_FILE = document.getElementById("triggerScript");
    const STEP_ELEMENT = document.getElementById("step");

    const CURRENT_POWER_DRAW_ELEMENT = document.getElementById("currentPowerDraw");
    const MAX_POWER_DRAW_ELEMENT = document.getElementById("maxPowerDraw");

    const PAUSE_BUTTON = document.getElementById("pauseButton");
    const JUMP_TO_STEP_INPUT = document.getElementById("jumpToStepInput");
    const APPLY_GAMMA_CHECKBOX = document.getElementById("applyGammaCheckbox");
    const STEP_INTERVAL_INPUT = document.getElementById("stepIntervalInput");

    // Matches MOCK_MS_PER_LOOP in lib/mock-arduino/Arduino.cpp — the measured
    // wall-clock time of one loop() iteration on the SAMD51 — so playback at
    // the default speed matches the real sculpture.
    const HARDWARE_MS_PER_LOOP = 62;

    function stepIntervalMs() {
      const parsed = parseInt(STEP_INTERVAL_INPUT.value);
      return parsed > 0 ? parsed : HARDWARE_MS_PER_LOOP;
    }

    let applyGamma = APPLY_GAMMA_CHECKBOX.checked;

    // TODO: measure more accurately, whether this is linear
    // const DRAW_PER_COLOR_PER_PANEL_AMPS = 0.8046715655; // Amps 12v
    const DRAW_PER_COLOR_PER_PANEL_AMPS = 0.438911763; // Amps 24v

    // Display gamma for the mock panels. The real LEDs are perceptually much
    // brighter at low values than an sRGB monitor renders raw RGB, so we
    // gamma-correct the displayed color (not the power-draw calc).
    const DISPLAY_GAMMA = 1.7;
    const GAMMA_LUT = (() => {
      const lut = new Uint8Array(256);
      for (let i = 0; i < 256; i++) {
        lut[i] = Math.round(Math.pow(i / 255, 1 / DISPLAY_GAMMA) * 255);
      }
      return lut;
    })();

    function calculatePowerDrawForColorAmps(color) {
      return (color / 255) * DRAW_PER_COLOR_PER_PANEL_AMPS;
    }

    function toByte(channel) {
      return typeof channel === "string" ? parseInt(channel, 16) : channel;
    }

    function toHexByte(value) {
      return value.toString(16).padStart(2, "0");
    }

    function clone(templateElement) {
      let clone = templateElement.cloneNode(true);
      clone.attributes.removeNamedItem("id");
      return clone;
    }

    function newPanelElement(index) {
      let panelElement = clone(PANEL_TEMPLATE_ELEMENT);
      panelElement.classList.add("panel-" + index);
      STAGE.appendChild(panelElement);
      return panelElement;
    }

    function getPowerDrawAmps(color) {
      return calculatePowerDrawForColorAmps(toByte(color.red))
        + calculatePowerDrawForColorAmps(toByte(color.green))
        + calculatePowerDrawForColorAmps(toByte(color.blue));
    }

    function colorToHexString(color) {
      const redByte   = toByte(color.red);
      const greenByte = toByte(color.green);
      const blueByte  = toByte(color.blue);
      if (applyGamma) {
        return "#"
          + toHexByte(GAMMA_LUT[redByte])
          + toHexByte(GAMMA_LUT[greenByte])
          + toHexByte(GAMMA_LUT[blueByte]);
      }
      return "#"
        + toHexByte(redByte)
        + toHexByte(greenByte)
        + toHexByte(blueByte);
    }

    class ScriptRunner {
      constructor() {
        this.running = false;
        this.panelUIs = [];
        this.maxAmps = 0;
        this.iteration = -1;

        for (let i = 0; i < 20; i++) {
          const panelElement = newPanelElement(i);
          this.panelUIs[i] = new PanelUI(panelElement);
        }
      }

      loadAndRun(scriptFile) {
        const reader = new FileReader();
        reader.addEventListener('progress', (event) => {
          if (event.loaded && event.total) {
            const percent = (event.loaded / event.total) * 100;
            console.log(`Progress: ${Math.round(percent)}`);
          }
        });
        reader.addEventListener("load", (event) => {
          const scriptText = reader.result;
          const script = JSON.parse(scriptText);
          this.run(script);
        });
        reader.readAsText(scriptFile);
      }

      run(script) {
        this.running = true;
        this.script = script;
        this._runInterval();
      }

      _runInterval() {
          this.interval = setInterval(() => this.runNextStep(), stepIntervalMs());
      }

      restartIntervalIfRunning() {
        if (this.interval) {
          clearInterval(this.interval);
          this._runInterval();
        }
      }

      runPreviousStep() {
        const prevIndex = this.iteration - 1;
        if (prevIndex < 0) {
          clearInterval(this.interval);
          return;
        }

        this._runStepAtIndex(prevIndex);
      }

      runNextStep() {
        const nextIndex = this.iteration + 1;
        if (nextIndex >= this.script.length) {
          clearInterval(this.interval);
          STEP_ELEMENT.innerText = "Finished " + this.script.length + " steps";
          return;
        }

        this._runStepAtIndex(nextIndex);
      }

      _runStepAtIndex(index) {
          this.iteration = index;
          this.step = this.script[this.iteration];
          STEP_ELEMENT.innerText = "running step " + this.iteration + " of " + this.script.length;
          JUMP_TO_STEP_INPUT.value = this.iteration;
          this.update(this.step.panels, this.step.interactions);
      }

      update(panels, interactions) {
        let totalAmps = 0;
        panels.forEach(panel => {
          let index = panel.index;
          let panelUI = this.panelUIs[index]
          panelUI.color = panel;
          // Prefer the per-panel "pir" field (0 = none, 1 = front, 2 = back,
          // 3 = both); fall back to decoding the "OK 011302..." interactions
          // string for older script.json files.
          panelUI.pir = panel.pir !== undefined
            ? String(panel.pir)
            : interactions.charAt(index + 3);
          panelUI.update();
          totalAmps += panelUI.amps;
        });

        CURRENT_POWER_DRAW_ELEMENT.value = totalAmps;
        this.maxAmps = Math.max(this.maxAmps, totalAmps);
        MAX_POWER_DRAW_ELEMENT.value = this.maxAmps;
      }

      togglePause() {
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
          PAUSE_BUTTON.innerText = "Continue";
        } else {
          this._runInterval();
          PAUSE_BUTTON.innerText = "Pause";
        }
      }

      jumpToStepIndex(index) {
        if (index < 0) {
          return;
        }
        this._runStepAtIndex(index);
      }

      refresh() {
        if (this.iteration >= 0 && this.script) {
          this._runStepAtIndex(this.iteration);
        }
      }
    }

    class PanelUI {
      constructor(panelContainerElement) {
        this.panelContainerElement = panelContainerElement;
        this.panelInfoElement = this.panelContainerElement.getElementsByClassName("panelInfo")[0];
        this.panelElement = this.panelContainerElement.getElementsByClassName("panel")[0];
        this.amps = 0;
        this.pir = "0";
        this.color = "000000";
      }

      update() {
        // Unknown digits fall through raw so a malformed PIR reply is visible.
        const PIR_LABELS = { "0": "&nbsp;", "1": "front", "2": "back", "3": "both" };
        const pirLabel = PIR_LABELS[this.pir] || this.pir;
        this.panelElement.style.backgroundColor = colorToHexString(this.color);
        this.panelInfoElement.innerHTML = pirLabel + `<br/>${this.color.red},${this.color.green},${this.color.blue}`;
        this.amps = getPowerDrawAmps(this.color);
      }
    }

    const scriptRunner = new ScriptRunner();

    PAUSE_BUTTON.addEventListener("click", () => {
        scriptRunner.togglePause();
    });

    JUMP_TO_STEP_INPUT.addEventListener("change", (event) => {
        scriptRunner.jumpToStepIndex(parseInt(event.target.value));
    });

    JUMP_TO_STEP_INPUT.addEventListener("keydown", (event) => {
       if (event.key === "ArrowUp") {
           scriptRunner.runNextStep();
       } else if (event.key === "ArrowDown") {
           scriptRunner.runPreviousStep();
       }
    });

    TRIGGER_SCRIPT_FILE.addEventListener("change", (event) => {
      const file = event.target.files[0];
      console.log(file);
      scriptRunner.loadAndRun(file);
    });

    STEP_INTERVAL_INPUT.addEventListener("change", () => {
      scriptRunner.restartIntervalIfRunning();
    });

    APPLY_GAMMA_CHECKBOX.addEventListener("change", () => {
      applyGamma = APPLY_GAMMA_CHECKBOX.checked;
      scriptRunner.refresh();
    });
  });
</script>
</body>
</html>
