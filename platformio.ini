; Aunisoma — single source tree, multiple build targets.
;
;   pio run -e grandcentral_m4              # firmware: legacy color algorithm (Aunisoma-Sketch)
;   pio run -e grandcentral_m4_wave         # firmware: wave color algorithm   (Wave-Sketch)
;   pio run -e grandcentral_m4_pir_test     # firmware: PIR wiring test        (PIR-Test-Sketch)
;   pio run -e grandcentral_m4_anim_test    # firmware: synced-pulse flicker test (AnimationPerformanceTest-Sketch)
;   pio run -e grandcentral_m4_glow         # firmware: glow color algorithm   (Glow-Sketch, per-panel pulsing, lagged neighbor ripple)
;   pio run -e grandcentral_m4_glow_timing  # firmware: glow + loop-timing stats over USB serial (MEASURE_LOOP_TIMING)
;   pio run -e native_glow                  # desktop mock: glow algorithm
;   pio run -e grandcentral_m4_wave_battery # firmware: wave algorithm, mock walk-by traffic (~50% occupancy over 5 min) for battery-life testing
;   pio run -e native_wave_battery          # desktop mock: wave battery-life test
;   pio run -e native                       # desktop mock: legacy algorithm
;   pio run -e native_wave                  # desktop mock: wave algorithm
;   pio run -e native_pir_test              # desktop mock: PIR test sketch
;   pio run -e native_anim_test             # desktop mock: animation performance test
;
; main.cpp is the desktop driver; it is excluded from every hardware build so
; the Arduino framework's main() is used there. Each sketch's setup()/loop()
; pair lives in <Sketch>.cpp; the build_src_filter selects exactly one sketch
; per environment.

[platformio]
src_dir = src
default_envs = grandcentral_m4

[env:grandcentral_m4]
platform = atmelsam
board = adafruit_grandcentral_m4
framework = arduino
build_src_filter = +<*> -<main.cpp> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>
lib_ignore = mock-arduino
; PCF8523 real-time clock (NightSchedule) on the main I2C port.
lib_deps = adafruit/RTClib @ ^2.1.4
build_flags =
    -DMOCK_INTERACTIONS=0

[env:grandcentral_m4_pir_test]
extends = env:grandcentral_m4
build_src_filter = +<*> -<main.cpp> -<Aunisoma-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>

[env:grandcentral_m4_wave]
extends = env:grandcentral_m4
build_src_filter = +<*> -<main.cpp> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>

[env:grandcentral_m4_wave_battery]
extends = env:grandcentral_m4_wave
build_flags =
    -DMOCK_INTERACTIONS=0
    -DMOCK_BATTERY_TEST=1

[env:grandcentral_m4_anim_test]
extends = env:grandcentral_m4
build_src_filter = +<*> -<main.cpp> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<Glow-Sketch.cpp>

[env:grandcentral_m4_glow]
extends = env:grandcentral_m4
build_src_filter = +<*> -<main.cpp> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp>

[env:grandcentral_m4_glow_timing]
extends = env:grandcentral_m4_glow
build_flags =
    -DMOCK_INTERACTIONS=0
    -DMEASURE_LOOP_TIMING=1

[env:native]
platform = native
extra_scripts = scripts/run_mock_target.py
build_src_filter = +<*> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0

[env:native_pir_test]
extends = env:native
build_src_filter = +<*> -<Aunisoma-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0

[env:native_wave]
extends = env:native
build_src_filter = +<*> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp> -<Glow-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0

[env:native_wave_battery]
extends = env:native_wave
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0
    -DMOCK_BATTERY_TEST=1

[env:native_anim_test]
extends = env:native
build_src_filter = +<*> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<Glow-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0

[env:native_glow]
extends = env:native
build_src_filter = +<*> -<Aunisoma-Sketch.cpp> -<PIR-Test-Sketch.cpp> -<Wave-Sketch.cpp> -<AnimationPerformanceTest-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0
