; Aunisoma — single source tree, two build targets.
;
;   pio run -e grandcentral_m4   # firmware for Adafruit Grand Central M4
;   pio run -e native            # desktop mock driver (writes script JSON to stdout)
;
; main.cpp is the desktop driver; it is excluded from the hardware build so the
; Arduino framework's main() is used there.

[platformio]
src_dir = src
default_envs = grandcentral_m4

[env:grandcentral_m4]
platform = atmelsam
board = adafruit_grandcentral_m4
framework = arduino
build_src_filter = +<*> -<main.cpp> -<Test-Sketch.cpp>
lib_ignore = mock-arduino
build_flags =
    -DMOCK_INTERACTIONS=0

[env:grandcentral_m4_test]
extends = env:grandcentral_m4
build_src_filter = +<*> -<main.cpp> -<Aunisoma-Sketch.cpp>

[env:native]
platform = native
build_src_filter = +<*> -<Test-Sketch.cpp>
build_flags =
    -std=c++17
    -g
    -O0
    -DMOCK_INTERACTIONS=0
